name: Build, Test and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aws-cicd-docker-deployment
  ECR_REGISTRY: 228210524459.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      # 4. Run tests
      - name: Run tests
        run: pytest

      # 5. Configure AWS authentication using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228210524459:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      # 6. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 7. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:latest \
            .

      # 9. Tag Docker image for ECR
      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:latest \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      # 10. Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest


      # 11. Deploy to EC2 using AWS Systems Manager
      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 228210524459.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 228210524459.dkr.ecr.us-east-1.amazonaws.com/aws-cicd-docker-deployment:latest",
              "docker rm -f aws-cicd-app || true",
              "docker run -d --name aws-cicd-app -p 80:5000 228210524459.dkr.ecr.us-east-1.amazonaws.com/aws-cicd-docker-deployment:latest"
            ]' \
            --query "Command.CommandId" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}"

          echo "EC2 deployment completed successfully."
